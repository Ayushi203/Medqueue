spring.application.name=medqueue

# Local secrets for development; optional so production can use env vars only
spring.config.import=optional:classpath:local-secrets.properties

# Clinic timezone. Appointment dates/times are local clock times, so the
# database connection and the app must use the same zone (MEDQUEUE_TIMEZONE)
medqueue.timezone=${MEDQUEUE_TIMEZONE:Asia/Kolkata}
spring.datasource.url=jdbc:mysql://localhost:3306/medqueue?useSSL=false&serverTimezone=${medqueue.timezone}
# Secrets: environment variables first, then local-secrets.properties (not in git)
spring.datasource.username=${MEDQUEUE_DB_USERNAME:${local.db-username:root}}
spring.datasource.password=${MEDQUEUE_DB_PASSWORD:${local.db-password:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${MEDQUEUE_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT signing key: at least 32 characters. Set MEDQUEUE_JWT_SECRET outside local dev.
medqueue.jwt.secret=${MEDQUEUE_JWT_SECRET:${local.jwt-secret:}}

# Admin login created on startup if it does not exist yet (change before deploying)
medqueue.seed-admin.name=MedQueue Admin
medqueue.seed-admin.email=${MEDQUEUE_ADMIN_EMAIL:${local.admin-email:}}
medqueue.seed-admin.password=${MEDQUEUE_ADMIN_PASSWORD:${local.admin-password:}}
